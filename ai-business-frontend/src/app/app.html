<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div>

      <!-- Logo -->
      <div class="logo">

        <div class="logo-icon">
          🤖
        </div>

        <div class="logo-text">
          <h2>AI Automation</h2>
          <p>Document Intelligence</p>
        </div>

      </div>

      <!-- Navigation -->
      <nav class="sidebar-menu">

        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <span>🏠</span>
          <span>Dashboard</span>

        </a>

        <a
          routerLink="/documents"
          routerLinkActive="active">

          <span>📂</span>
          <span>Documents</span>

        </a>

        <a
          routerLink="/chat"
          routerLinkActive="active">

          <span>🤖</span>
          <span>AI Chat</span>

        </a>

      </nav>

    </div>

    <!-- Bottom -->
    <div class="sidebar-bottom">

      <div class="user-info">

        <div class="avatar-small">
          P
        </div>

        <div>

          <strong>Preksha</strong>

          <small>Cloud Engineer</small>

        </div>

      </div>

      <button
        class="logout-btn"
        *ngIf="auth.isAuthenticated()"
        (click)="auth.logout()">

        🚪 Logout

      </button>

    </div>

  </aside>

  <!-- Main -->
  <div class="main-layout">

    <header class="topbar">

      <h2>AI Business Automation</h2>

    </header>

    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
